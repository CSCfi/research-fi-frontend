@if (!useNewLayoutButton && !useTextOnlyLink) {
  <div class="share">
    <app-secondary-button
      [cdkCopyToClipboard]="urlToShare"
      (click)="openSnackBar()"
      [content]="copyLink"
      [svgSymbolName]="'copy'"
      [svgCssClass]="'copy-icon button-icon'"
      [big]="big"
    ></app-secondary-button>
  </div>
}

@if (useNewLayoutButton && !useTextOnlyLink) {
  <div>
    <app-tertiary-button class="mx-4" [cdkCopyToClipboard]="urlToShare" content="Jaa profiili" i18n-content="@@shareProfile"
                         [svgSymbolName]="'share'" [svgCssClass]="'share-icon button-icon'"
                         (click)="openSnackBar()"></app-tertiary-button>
  </div>
}

@if (useTextOnlyLink) {
  <div>
    <div class="urn-text-link" [cdkCopyToClipboard]="urlToShare" (click)="openSnackBar()"><span [class.d-none]="!showUrnTextPrefix">URN: </span><span class="underlined-link">{{urlToShare}}</span><app-svg-sprites [iconName]="'copy'" cssClass="button-icon copy-icon svg-icon"></app-svg-sprites></div>
  </div>
}
